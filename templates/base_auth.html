{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Entrar — AHP Engenharia{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body>
  <div class="auth-hero d-flex align-items-center">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="text-white text-center mb-4">
            <h1 class="h3 fw-bold">AHP Engenharia</h1>
            <p class="mb-0">Apoio à decisão na contratação de serviços de engenharia</p>
          </div>
          <div class="card auth-card p-4">
            {% if messages %}
              {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
              {% endfor %}
            {% endif %}
            {% block content %}{% endblock %}
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
