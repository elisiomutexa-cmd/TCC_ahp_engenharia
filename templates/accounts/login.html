{% extends "base_auth.html" %}
{% block content %}
<h2 class="h5 mb-3">Entrar</h2>
<form method="post">
  {% csrf_token %}
  {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
  <div class="mb-3">
    <label class="form-label" for="id_username">Utilizador</label>
    <input class="form-control" type="text" name="username" id="id_username" required autofocus>
  </div>
  <div class="mb-3">
    <label class="form-label" for="id_password">Palavra-passe</label>
    <input class="form-control" type="password" name="password" id="id_password" required>
  </div>
  <button class="btn btn-primary w-100" type="submit">Entrar</button>
</form>
<p class="mt-3 mb-0 text-center"><a href="{% url 'accounts:password_reset' %}">Recuperar palavra-passe</a></p>
<p class="small text-muted mt-3 mb-0">Dados de demonstração: <code>admin</code> / <code>Admin@123456</code></p>
{% endblock %}
