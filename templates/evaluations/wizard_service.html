{% extends "base.html" %}{% block page_title %}Nova avaliação — serviço{% endblock %}{% block content %}{% include 'includes/wizard.html' %}<form method="post" class="card panel p-4">{% csrf_token %}<h2 class="h5">Passo 1: selecionar serviço</h2><p class="text-muted">Escolha o serviço de engenharia que será objeto da decisão.</p><select required class="form-select mb-3" name="service"><option value="">Selecione um serviço</option>{% for service in services %}<option value="{{ service.pk }}" {% if preselect == service.pk|stringformat:'s' %}selected{% endif %}>{{ service.name }} — {{ service.get_service_type_display }}</option>{% endfor %}</select><button class="btn btn-primary">Continuar</button></form>{% endblock %}
